<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title and Metadata for local SEO -->
    <title>The Sugar Story | Premium Homemade Bakery by Chef Shalini Singh</title>
    <meta name="description" content="Exquisite customized celebration cakes, cookies, and artisanal breads handcrafted in Bhopal by ex-Taj Pastry Chef Shalini Singh." />
    
    <!-- Open Graph tags for social share -->
    <meta property="og:title" content="The Sugar Story | Premium Homemade Bakery by Chef Shalini Singh" />
    <meta property="og:description" content="Exquisite customized celebration cakes, cookies, and artisanal breads handcrafted in Bhopal by ex-Taj Pastry Chef Shalini Singh." />
    <meta property="og:image" content="http://localhost:3000/hero-poster.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:3000/" />

    <!-- Local Business Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Bakery",
      "name": "The Sugar Story",
      "image": "http://localhost:3000/hero-poster.png",
      "@id": "http://localhost:3000/#bakery",
      "url": "http://localhost:3000/",
      "telephone": "+917906759188",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Arera Colony",
        "addressLocality": "Bhopal",
        "addressRegion": "MP",
        "postalCode": "462016",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 23.216,
        "longitude": 77.436
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
          "Sunday"
        ],
        "opens": "09:00",
        "closes": "21:00"
      }
    }
    </script>

    <!-- Modern Google Fonts Loaders -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Allison&display=swap" rel="stylesheet">

  <body class="bg-cream text-cocoa selection:bg-primary selection:text-cream min-h-screen">
